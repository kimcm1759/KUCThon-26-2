<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과음 재생기</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e3e1dc; --btn: #f0eee9; --btn-hover: #e6e3dc; --accent: #d9480f; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --card: #1f1f22; --text: #f2f2f3; --muted: #9a9aa1;
      --line: #2e2e33; --btn: #2a2a2f; --btn-hover: #34343a; --accent: #ff6b2c; --accent-text: #111;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .now { color: var(--muted); font-size: 14px; min-height: 1.5em; }
  .tool { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; }
  .tool-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .tool-head h2 { font-size: 16px; margin: 0; }
  .tool-head code { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--btn); border-radius: 10px; padding: 10px 12px; text-align: left; }
  button:hover { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .snd .role { display: block; font-weight: 600; }
  .snd .desc { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .snd.playing { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .snd.missing { opacity: .45; cursor: default; }
  .seq { background: var(--accent); color: var(--accent-text); border-color: transparent;
    font-weight: 600; padding: 8px 12px; white-space: nowrap; }
  .seq:hover { background: var(--accent); filter: brightness(1.08); }
  .plain { padding: 8px 12px; }
  h3 { font-size: 15px; margin: 26px 0 10px; }
</style>
</head>
<body>
<main>
  <h1>효과음 재생기</h1>
  <p class="sub">버튼을 누르면 바로 재생됩니다. 다른 버튼을 누르면 이전 소리는 멈춥니다. "순서대로"는 준비 → 핵심 → 세부 → 종료를 이어서 들려줍니다.</p>
  <div class="bar">
    <button class="plain" id="stop">■ 정지</button>
    <span class="now" id="now"></span>
  </div>
  <section class="tool"><div class="tool-head"><h2>유압 프레스<code>hydraulic_press</code></h2><button class="seq" data-tool="hydraulic_press">▶ 순서대로</button></div><div class="grid"><button class="snd" data-tool="hydraulic_press" data-src="../assets/audio/tools/hydraulic_press/activation_001.wav" data-label="유압 프레스 · 준비·시작" title="hydraulic_press_activation_001"><span class="role">준비·시작</span><span class="desc">모터·유압이 작동하며 저음 모터음이 점점 커지고 높아지는 소리 + 상승하는 유압 쉭 소리.</span></button><button class="snd" data-tool="hydraulic_press" data-src="../assets/audio/tools/hydraulic_press/main_action_001.wav" data-label="유압 프레스 · 핵심 동작" title="hydraulic_press_main_action_001"><span class="role">핵심 동작</span><span class="desc">프레스가 내려오며 누르는 깊은 저음 럼블과 신음 같은 압축음.</span></button><button class="snd" data-tool="hydraulic_press" data-src="../assets/audio/tools/hydraulic_press/impact_detail_001.wav" data-label="유압 프레스 · 세부" title="hydraulic_press_impact_detail_001"><span class="role">세부</span><span class="desc">눌리며 생기는 불규칙한 찌그러짐·균열 조각음, 짧은 금속 울림, 삐걱임.</span></button><button class="snd" data-tool="hydraulic_press" data-src="../assets/audio/tools/hydraulic_press/finish_001.wav" data-label="유압 프레스 · 종료·잔향" title="hydraulic_press_finish_001"><span class="role">종료·잔향</span><span class="desc">기계가 멈추는 쿵 + 압력 해제 쉭 + 모터가 느려지며 꺼지는 소리, 짧은 잔향.</span></button></div></section>
  <section class="tool"><div class="tool-head"><h2>망치<code>hammer</code></h2><button class="seq" data-tool="hammer">▶ 순서대로</button></div><div class="grid"><button class="snd" data-tool="hammer" data-src="../assets/audio/tools/hammer/activation_001.wav" data-label="망치 · 준비·시작" title="hammer_activation_001"><span class="role">준비·시작</span><span class="desc">망치를 휘두르는 짧은 공기음(휙).</span></button><button class="snd" data-tool="hammer" data-src="../assets/audio/tools/hammer/main_action_001.wav" data-label="망치 · 핵심 동작" title="hammer_main_action_001"><span class="role">핵심 동작</span><span class="desc">날카로운 어택 뒤 짧은 저음 쿵과 몸체 울림이 있는 강한 타격음.</span></button><button class="snd" data-tool="hammer" data-src="../assets/audio/tools/hammer/impact_detail_001.wav" data-label="망치 · 세부" title="hammer_impact_detail_001"><span class="role">세부</span><span class="desc">타격 직후의 균열음과 작은 조각이 튀는 틱틱 소리.</span></button><button class="snd" data-tool="hammer" data-src="../assets/audio/tools/hammer/finish_001.wav" data-label="망치 · 종료·잔향" title="hammer_finish_001"><span class="role">종료·잔향</span><span class="desc">파편이 흩어져 떨어지며 점점 잦아드는 소리와 잔향.</span></button></div></section>
  <section class="tool"><div class="tool-head"><h2>알루미늄 배트<code>aluminum_bat</code></h2><button class="seq" data-tool="aluminum_bat">▶ 순서대로</button></div><div class="grid"><button class="snd" data-tool="aluminum_bat" data-src="../assets/audio/tools/aluminum_bat/activation_001.wav" data-label="알루미늄 배트 · 준비·시작" title="aluminum_bat_activation_001"><span class="role">준비·시작</span><span class="desc">배트를 크게 휘둘러 공기를 가르는 휙 소리.</span></button><button class="snd" data-tool="aluminum_bat" data-src="../assets/audio/tools/aluminum_bat/main_action_001.wav" data-label="알루미늄 배트 · 핵심 동작" title="aluminum_bat_main_action_001"><span class="role">핵심 동작</span><span class="desc">속 빈 금속 배트의 깡 하는 타격음과 둔탁한 충격.</span></button><button class="snd" data-tool="aluminum_bat" data-src="../assets/audio/tools/aluminum_bat/impact_detail_001.wav" data-label="알루미늄 배트 · 세부" title="aluminum_bat_impact_detail_001"><span class="role">세부</span><span class="desc">타격 후 금속이 떨리는 트레몰로 울림과 작은 파편 소리.</span></button><button class="snd" data-tool="aluminum_bat" data-src="../assets/audio/tools/aluminum_bat/finish_001.wav" data-label="알루미늄 배트 · 종료·잔향" title="aluminum_bat_finish_001"><span class="role">종료·잔향</span><span class="desc">금속 떨림이 맥놀이를 내며 천천히 감쇠하는 잔향.</span></button></div></section>
  <section class="tool"><div class="tool-head"><h2>레이저<code>laser</code></h2><button class="seq" data-tool="laser">▶ 순서대로</button></div><div class="grid"><button class="snd" data-tool="laser" data-src="../assets/audio/tools/laser/activation_001.wav" data-label="레이저 · 준비·시작" title="laser_activation_001"><span class="role">준비·시작</span><span class="desc">음높이가 빠르게 올라가는 충전·조준음.</span></button><button class="snd" data-tool="laser" data-src="../assets/audio/tools/laser/main_action_001.wav" data-label="레이저 · 핵심 동작" title="laser_main_action_001"><span class="role">핵심 동작</span><span class="desc">발사 순간의 지직 소리 후 이어지는 굵은 지속 빔 웅웅 소리와 고음 윙.</span></button><button class="snd" data-tool="laser" data-src="../assets/audio/tools/laser/impact_detail_001.wav" data-label="레이저 · 세부" title="laser_impact_detail_001"><span class="role">세부</span><span class="desc">표면을 지지는 치이익 소리와 작은 튀는 소리(지짐·절단).</span></button><button class="snd" data-tool="laser" data-src="../assets/audio/tools/laser/finish_001.wav" data-label="레이저 · 종료·잔향" title="laser_finish_001"><span class="role">종료·잔향</span><span class="desc">빔이 꺼지며 음높이가 떨어지는 전원 감쇠음.</span></button></div></section>
  <section class="tool"><div class="tool-head"><h2>폭탄<code>bomb</code></h2><button class="seq" data-tool="bomb">▶ 순서대로</button></div><div class="grid"><button class="snd" data-tool="bomb" data-src="../assets/audio/tools/bomb/activation_001.wav" data-label="폭탄 · 준비·시작" title="bomb_activation_001"><span class="role">준비·시작</span><span class="desc">퓨즈가 타들어가는 치지직 소리와 불꽃 튀는 소리, 아래로 깔리는 긴장음.</span></button><button class="snd" data-tool="bomb" data-src="../assets/audio/tools/bomb/main_action_001.wav" data-label="폭탄 · 핵심 동작" title="bomb_main_action_001"><span class="role">핵심 동작</span><span class="desc">날카로운 폭발 어택과 묵직한 저음 충격파, 긴 잔향.</span></button><button class="snd" data-tool="bomb" data-src="../assets/audio/tools/bomb/impact_detail_001.wav" data-label="폭탄 · 세부" title="bomb_impact_detail_001"><span class="role">세부</span><span class="desc">폭발 직후 공기가 휩쓸리는 소리와 흩어지는 잔해.</span></button><button class="snd" data-tool="bomb" data-src="../assets/audio/tools/bomb/finish_001.wav" data-label="폭탄 · 종료·잔향" title="bomb_finish_001"><span class="role">종료·잔향</span><span class="desc">멀어지는 저음 럼블과 잔해가 간간이 떨어지는 소리.</span></button></div></section>
  <h3>받은 음원 (도구·역할 미정)</h3><section class="tool"><div class="grid"><button class="snd" data-tool="provided" data-src="../assets/audio/provided/paper_tear_001.mp3" data-label="종이 찢는소리" title="paper_tear_001"><span class="role">종이 찢는소리</span><span class="desc">paper_tear_001</span></button><button class="snd" data-tool="provided" data-src="../assets/audio/provided/paper_other_001.mp3" data-label="종이 가볍게 팔랑거리는 소리" title="paper_other_001"><span class="role">종이 가볍게 팔랑거리는 소리</span><span class="desc">paper_other_001</span></button></div></section>
</main>
<script>
  const audio = new Audio();
  const now = document.getElementById('now');
  let queue = [];
  let activeBtn = null;

  function mark(btn) {
    if (activeBtn) activeBtn.classList.remove('playing');
    activeBtn = btn;
    if (btn) btn.classList.add('playing');
  }
  function play(btn) {
    audio.pause();
    audio.src = btn.dataset.src;
    audio.currentTime = 0;
    mark(btn);
    now.textContent = '재생 중: ' + btn.dataset.label;
    audio.play().catch(() => { now.textContent = '재생 실패: ' + btn.dataset.src; mark(null); });
  }
  function stop() {
    queue = []; audio.pause(); mark(null); now.textContent = '';
  }
  audio.addEventListener('ended', () => {
    if (queue.length) { play(queue.shift()); }
    else { mark(null); now.textContent = ''; }
  });
  document.querySelectorAll('.snd[data-src]').forEach(b =>
    b.addEventListener('click', () => { queue = []; play(b); }));
  document.querySelectorAll('.seq').forEach(b =>
    b.addEventListener('click', () => {
      const list = [...document.querySelectorAll('.snd[data-src][data-tool="' + b.dataset.tool + '"]')];
      if (!list.length) return;
      queue = list.slice(1); play(list[0]);
    }));
  document.getElementById('stop').addEventListener('click', stop);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });
</script>
</body>
</html>
